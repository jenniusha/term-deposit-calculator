<template>
    <lightning-card title="💰 Term Deposit Calculator" icon-name="utility:money">
        <div class="slds-p-around_medium">

            <!-- Start Deposit Amount -->
            <lightning-input 
                label="Start Deposit Amount" 
                name="startAmount" 
                type="number" 
                value={startAmount} 
                onchange={handleChange}
                class="slds-m-bottom_small">
            </lightning-input>
            <template if:true={startAmountError}>
                <p class="slds-text-color_error slds-text-body_small slds-m-top_xx-small">{startAmountError}</p>
            </template>

            <!-- Interest Rate (%) -->
            <lightning-input 
                label="Interest Rate (%)" 
                name="interestRate" 
                type="number" 
                step="0.01" 
                value={interestRate} 
                onchange={handleChange}
                class="slds-m-bottom_small">
            </lightning-input>
            <template if:true={interestRateError}>
                <p class="slds-text-color_error slds-text-body_small slds-m-top_xx-small">{interestRateError}</p>
            </template>

            <!-- Investment Term (Years, can be fractional) -->
            <lightning-input 
                label="Investment Term (Years, can be fractional)" 
                name="termYears" 
                type="number" 
                step="0.1" 
                value={termYears} 
                onchange={handleChange}
                class="slds-m-bottom_small">
            </lightning-input>
            <template if:true={termYearsError}>
                <p class="slds-text-color_error slds-text-body_small slds-m-top_xx-small">{termYearsError}</p>
            </template>

            <!-- Interest Frequency -->
            <lightning-combobox 
                label="Interest Frequency" 
                name="interestFrequency" 
                value={interestFrequency} 
                options={frequencyOptions} 
                onchange={handleChange}
                class="slds-m-bottom_medium">
            </lightning-combobox>

            <!-- Calculate Button -->
            <div class="slds-align_absolute-center slds-m-top_medium">
                <lightning-button 
                    label="Calculate" 
                    variant="brand" 
                    onclick={calculate}>
                </lightning-button>
            </div>

            <!-- Results -->
            <template if:true={result}>
                <div class="slds-m-top_large">
                <p class="slds-text-heading_small">
                Final Balance: 
                <span class="slds-text-color_success">${result.finalBalance}</span>
                </p>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
